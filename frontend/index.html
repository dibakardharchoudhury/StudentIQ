<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          (param === "dark" || param === "light") ? param : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="StudentIQ: bright learning adventures, guided by parents." />
    <title>StudentIQ · Learn together</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f3f5ff;
        --cp-bg-elevated: #f8faff;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #d8ddf1;
        --cp-border-strong: #8992b5;
        --cp-text: #222344;
        --cp-text-muted: #515475;
        --cp-text-soft: #626580;
        --cp-accent: #6542c1;
        --cp-accent-hover: #51309e;
        --cp-accent-soft: rgba(101, 66, 193, 0.10);
        --cp-accent-fg: #ffffff;
        --cp-success: #137b5b;
        --cp-danger: #ba254c;
        --cp-warning: #a56800;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(48, 39, 99, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(101, 66, 193, 0.16);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #11152a;
        --cp-bg-elevated: #191e38;
        --cp-surface: #202642;
        --cp-surface-soft: #252d4d;
        --cp-border: #414a72;
        --cp-border-strong: #7984b0;
        --cp-text: #f4f3ff;
        --cp-text-muted: #bbc3e5;
        --cp-text-soft: #c1c7e3;
        --cp-accent: #c6adff;
        --cp-accent-hover: #d8c7ff;
        --cp-accent-soft: rgba(198, 173, 255, 0.14);
        --cp-accent-fg: #201138;
        --cp-success: #61deb3;
        --cp-danger: #f87171;
        --cp-warning: #ffd17b;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        --cp-overlay: rgba(32, 38, 66, 0.88);
        --cp-panel: rgba(32, 38, 66, 0.72);
        --cp-panel-strong: rgba(32, 38, 66, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.04);
        --cp-highlight: rgba(198, 173, 255, 0.18);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>StudentIQ needs JavaScript. No microphone or camera is used without your action.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
